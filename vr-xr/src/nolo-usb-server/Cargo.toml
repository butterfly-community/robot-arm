[package]
name = "nolo-usb-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Direct USB backend for the NOLO CV1 controller viewer"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
fusion-ahrs = "0.7"
futures-core = "0.3"
hidapi = { version = "2.6", default-features = false, features = ["linux-static-libusb"] }
nalgebra = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
lto = "thin"
strip = "symbols"
