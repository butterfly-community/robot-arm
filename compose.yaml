name: robot-arm-services

x-dora-environment: &dora-environment
  DORA_COORDINATOR_HOST: dora-coordinator
  DORA_ZENOH_ENDPOINT_EXCHANGE_TIMEOUT_MS: "0"

x-dora-daemon: &dora-daemon
  init: true
  # Zenoh locks POSIX SHM pages: its default 16 MiB pool exceeds Docker's
  # 8 MiB memlock allowance. Keep the same SHM transport, without an app fallback.
  ulimits:
    memlock: -1
  entrypoint: ["/usr/local/bin/dora-entrypoint.sh"]
  command:
    [
      "bash",
      "-c",
      'exec dora daemon --machine-id "$$DORA_MACHINE_ID"',
    ]
  depends_on:
    dora-coordinator:
      condition: service_started
  networks: [robot-services]
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/53291"]

x-web-app: &web-app
  image: robot-arm-services-frontend
  networks: [robot-services]

services:
  dora-coordinator:
    image: robot-arm-services-backend-runtime:2026.09.05-r3
    command: ["dora", "coordinator", "--interface", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6013"]
    networks: [robot-services]

  controller-input:
    <<: *dora-daemon
    image: robot-arm-services-controller-input
    build:
      context: .
      dockerfile: backend/nodes/controller-input/Dockerfile
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: controller-input
      CONTROLLER_INPUT_CONFIG: /config/controller-input.json
    volumes:
      - ./backend/config/runtime:/config
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /sys:/sys:ro
    device_cgroup_rules:
      - "c 13:* rwm"
      - "c 189:* rwm"

  spatial-transform:
    <<: *dora-daemon
    image: robot-arm-services-spatial-transform
    build:
      context: .
      dockerfile: backend/nodes/spatial-transform/Dockerfile
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: spatial-transform
      SPATIAL_CONFIG: /config/spatial-transform.json
    volumes: ["./backend/config/runtime:/config"]

  perception-compute:
    image: robot-arm-services-perception-compute
    build:
      context: ./backend/services/perception-compute
      dockerfile: Dockerfile
    networks: [robot-services]
    environment:
      GRASPGENX_SEED: ${GRASPGENX_SEED:-0}
      GRASPGENX_NUM_GRASPS: ${GRASPGENX_NUM_GRASPS:-200}
    healthcheck:
      test: ["CMD", "/opt/compute-venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]

  camera:
    <<: *dora-daemon
    image: robot-arm-services-camera
    build:
      context: .
      dockerfile: backend/nodes/camera/Dockerfile
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: camera
      CAMERA_CONFIG: /config/camera.json
    volumes:
      - ./backend/config/runtime:/config
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /sys:/sys:ro
    device_cgroup_rules:
      - "c 81:* rwm"
      - "c 189:* rwm"
      - "c 235:* rwm"

  perception:
    <<: *dora-daemon
    image: robot-arm-services-perception
    build:
      context: .
      dockerfile: backend/nodes/scene/Dockerfile
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: perception
      SCENE_CONFIG: /config/scene.json
    depends_on:
      dora-coordinator: { condition: service_started }
      perception-compute: { condition: service_healthy }
    volumes: ["./backend/config/runtime:/config"]

  service-status:
    <<: *dora-daemon
    image: robot-arm-services-service-status
    build:
      context: .
      dockerfile: backend/nodes/service-status/Dockerfile
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: service-status
      SERVICE_STATUS_CONFIG: /config/service-status.json
    volumes: ["./backend/config/service-status.json:/config/service-status.json:ro"]

  stararm-102-execution:
    <<: *dora-daemon
    image: robot-arm-services-stararm-102-execution
    build:
      context: .
      dockerfile: backend/devices/stararm-102/nodes/execution/Dockerfile
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: stararm-102-execution
      STARARM_EXECUTION_CONFIG: /config/stararm-102-execution.json
    volumes:
      - ./backend/config/runtime:/config
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /sys:/sys:ro
    device_cgroup_rules:
      - "c 188:* rwm"

  web-gateway:
    <<: *dora-daemon
    image: robot-arm-services-web-gateway
    build:
      context: .
      dockerfile: backend/nodes/web-gateway/Dockerfile
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: web-gateway

  stararm-102-motion:
    <<: *dora-daemon
    image: robot-arm-services-stararm-102-motion
    shm_size: 2g
    build:
      context: .
      dockerfile: backend/devices/stararm-102/nodes/motion/Dockerfile
    entrypoint: ["/usr/local/bin/motion-entrypoint.sh"]
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: stararm-102-motion
      ROS_DOMAIN_ID: "42"
      STARARM_MOTION_CONFIG: /config/stararm-102-motion.json
    ports: ["192.168.100.10:6080:6080"]
    volumes: ["./backend/config/runtime:/config"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/53291 && exec 4<>/dev/tcp/127.0.0.1/6080"]

  dataflow:
    image: robot-arm-services-backend-runtime:2026.09.05-r3
    entrypoint: ["/usr/local/bin/dora-entrypoint.sh"]
    command: ["dora", "start", "--name", "robot-arm-services", "--attach", "/config/dataflow.yml"]
    environment:
      <<: *dora-environment
    networks: [robot-services]
    stop_signal: SIGINT
    healthcheck: { disable: true }
    volumes:
      - ./dataflow.yml:/config/dataflow.yml:ro
      - ./temp/recordings:/recordings
    depends_on:
      controller-input: { condition: service_healthy }
      perception: { condition: service_healthy }
      service-status: { condition: service_healthy }
      spatial-transform: { condition: service_healthy }
      camera: { condition: service_healthy }
      stararm-102-motion: { condition: service_healthy }
      stararm-102-execution: { condition: service_healthy }
      web-gateway: { condition: service_healthy }

  web-tracking:
    <<: *web-app
    build:
      context: ./frontend
      dockerfile: web/Dockerfile
    environment: { WEB_APP: tracking }
  web-spatial:
    <<: *web-app
    environment: { WEB_APP: spatial }
  web-perception:
    <<: *web-app
    environment:
      WEB_APP: perception
      GATEWAY_INTERNAL_URL: http://web-gateway:8080
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_AUTH_HEADER: ${AI_API_AUTH_HEADER:-Authorization}
  web-motion:
    <<: *web-app
    environment: { WEB_APP: motion }
  web-arm-execution:
    <<: *web-app
    environment: { WEB_APP: arm-execution }

  web-entry:
    image: nginx:stable-alpine
    ports: ["192.168.100.10:8765:8765"]
    volumes: ["./frontend/web/entry/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [web-tracking, web-spatial, web-perception, web-motion, web-arm-execution, web-gateway]
    networks: [robot-services]

  integration-test:
    image: node:24-trixie-slim
    profiles: ["test"]
    command: ["node", "/workspace/tests/integration/software-flow.mjs"]
    environment:
      SERVICES_BASE_URL: http://web-entry:8765
    volumes:
      - "./tests:/workspace/tests:ro"
      - "./backend/nodes/camera/assets:/workspace/backend/nodes/camera/assets:ro"
      - "./temp:/workspace/temp"
    networks: [robot-services]

networks:
  robot-services:
