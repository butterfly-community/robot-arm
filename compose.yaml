name: robot-arm-services

x-dora-environment: &dora-environment
  DORA_COORDINATOR_HOST: dora-coordinator
  DORA_ZENOH_ENDPOINT_EXCHANGE_TIMEOUT_MS: "0"

x-dora-daemon: &dora-daemon
  init: true
  command:
    [
      "bash",
      "-c",
      'exec dora daemon --machine-id "$$DORA_MACHINE_ID"',
    ]
  depends_on:
    dora-coordinator:
      condition: service_started
  networks: [robot-services]
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/53291"]

x-backend-daemon: &backend-daemon
  <<: *dora-daemon
  image: robot-arm-services-backend
  entrypoint: ["/src/docker/dora-entrypoint.sh"]

x-web-app: &web-app
  image: robot-arm-services-frontend
  networks: [robot-services]

services:
  dora-coordinator:
    image: robot-arm-services-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["dora", "coordinator", "--interface", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6013"]
    networks: [robot-services]

  controller-input:
    <<: *backend-daemon
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: controller-input
      CONTROLLER_INPUT_CONFIG: /config/controller-input.json
    volumes:
      - ./backend/config/runtime:/config
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /sys:/sys:ro
    device_cgroup_rules:
      - "c 13:* rwm"
      - "c 189:* rwm"

  spatial-transform:
    <<: *backend-daemon
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: spatial-transform
      SPATIAL_CONFIG: /config/spatial-transform.json
    volumes: ["./backend/config/runtime:/config"]

  perception-compute:
    image: robot-arm-services-perception-compute
    build:
      context: ./backend/services/perception-compute
      dockerfile: Dockerfile
    networks: [robot-services]
    environment:
      GRASPGENX_SEED: ${GRASPGENX_SEED:-0}
    healthcheck:
      test: ["CMD", "/opt/compute-venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]

  perception:
    <<: *backend-daemon
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: perception
      CAMERA_CAPTURE_CONFIG: /config/camera-capture.json
      PERCEPTION_CONFIG: /config/perception.json
    depends_on:
      dora-coordinator: { condition: service_started }
      perception-compute: { condition: service_healthy }
    volumes:
      - ./backend/config/runtime:/config
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /sys:/sys:ro
    device_cgroup_rules:
      - "c 81:* rwm"
      - "c 189:* rwm"
      - "c 235:* rwm"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/53291"]

  service-status:
    <<: *backend-daemon
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: service-status
      SERVICE_STATUS_CONFIG: /config/service-status.json
    volumes: ["./backend/config/service-status.json:/config/service-status.json:ro"]

  stararm-102-execution:
    <<: *backend-daemon
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: stararm-102-execution
      STARARM_EXECUTION_CONFIG: /config/stararm-102-execution.json
    volumes:
      - ./backend/config/runtime:/config
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /sys:/sys:ro
    device_cgroup_rules:
      - "c 188:* rwm"

  web-gateway:
    <<: *backend-daemon
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: web-gateway

  stararm-102-motion:
    <<: *dora-daemon
    image: robot-arm-services-backend
    entrypoint: ["/src/devices/stararm-102/docker/motion-entrypoint.sh"]
    environment:
      <<: *dora-environment
      DORA_MACHINE_ID: stararm-102-motion
      ROS_DOMAIN_ID: "42"
      STARARM_MOTION_CONFIG: /config/stararm-102-motion.json
    ports: ["192.168.100.10:6080:6080"]
    ulimits:
      memlock: -1
    volumes: ["./backend/config/runtime:/config"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/53291 && exec 4<>/dev/tcp/127.0.0.1/6080"]

  dataflow:
    image: robot-arm-services-backend
    entrypoint: ["/src/docker/dora-entrypoint.sh"]
    command: ["dora", "start", "--name", "robot-arm-services", "--attach", "/config/dataflow.yml"]
    environment:
      <<: *dora-environment
    networks: [robot-services]
    stop_signal: SIGINT
    healthcheck: { disable: true }
    volumes:
      - ./dataflow.yml:/config/dataflow.yml:ro
      - ./tools/replay/artifacts:/recordings
    depends_on:
      controller-input: { condition: service_healthy }
      perception: { condition: service_healthy }
      service-status: { condition: service_healthy }
      spatial-transform: { condition: service_healthy }
      stararm-102-motion: { condition: service_healthy }
      stararm-102-execution: { condition: service_healthy }
      web-gateway: { condition: service_healthy }

  web-tracking:
    <<: *web-app
    build:
      context: ./frontend
      dockerfile: web/Dockerfile
    environment: { WEB_APP: tracking }
  web-spatial:
    <<: *web-app
    environment: { WEB_APP: spatial }
  web-perception:
    <<: *web-app
    environment: { WEB_APP: perception }
  web-motion:
    <<: *web-app
    environment: { WEB_APP: motion }
  web-arm-execution:
    <<: *web-app
    environment: { WEB_APP: arm-execution }

  web-entry:
    image: nginx:stable-alpine
    ports: ["192.168.100.10:8765:8765"]
    volumes: ["./frontend/web/entry/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [web-tracking, web-spatial, web-perception, web-motion, web-arm-execution, web-gateway]
    networks: [robot-services]

  integration-test:
    image: node:24-trixie-slim
    profiles: ["test"]
    command: ["node", "/tests/integration/software-flow.mjs"]
    environment:
      SERVICES_BASE_URL: http://web-entry:8765
    volumes: ["./tests:/tests:ro"]
    networks: [robot-services]

networks:
  robot-services:
