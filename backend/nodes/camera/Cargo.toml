[package]
name = "camera-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
realsense-runtime = ["dep:realsense-camera", "realsense-camera/runtime"]
realsense-doc-only = ["realsense-runtime", "realsense-camera/docs-only"]
opencv-runtime = ["dep:camera-calibration"]

[[bin]]
name = "camera-node"
path = "src/main.rs"

[[bin]]
name = "realsense-smoke"
path = "src/bin/realsense-smoke.rs"
required-features = ["realsense-runtime"]

[dependencies]
axum.workspace = true
camera-calibration = { workspace = true, optional = true }
dora-node-api.workspace = true
eyre.workspace = true
futures.workspace = true
image.workspace = true
json-config-store.workspace = true
nalgebra.workspace = true
opencv.workspace = true
realsense-camera = { workspace = true, optional = true }
robot-arm-messages.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio-tungstenite = "0.29.0"
