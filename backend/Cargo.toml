[workspace]
resolver = "2"
members = [
  "crates/json-config-store",
  "crates/perception-core",
  "crates/robot-arm-messages",
  "crates/spatial-core",
  "devices/stararm-102/crates/model",
  "crates/fashionstar-uart",
  "crates/nolo-cv1",
  "nodes/controller-input",
  "nodes/perception",
  "nodes/service-status",
  "nodes/spatial-transform",
  "devices/stararm-102/nodes/motion",
  "devices/stararm-102/nodes/execution",
  "nodes/web-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
approx = "0.5.1"
arrow = { version = "59.2.0", default-features = false }
axum = { version = "0.8.7", features = ["ws"] }
base64 = "0.23.1"
dora-node-api = { version = "1.0.0-rc.5", default-features = false, features = ["arrow-v59"] }
eyre = "0.6.12"
futures = "0.3.32"
hex = "0.4.3"
image = { version = "0.25.8", default-features = false, features = ["png"] }
mime_guess = "2.0.5"
nalgebra = { version = "0.35.0", features = ["serde-serialize"] }
opencv = { version = "0.100.1", default-features = false, features = ["calib", "clang-runtime", "geometry", "imgcodecs", "imgproc", "objdetect"] }
robot-arm-messages = { path = "crates/robot-arm-messages" }
fashionstar-uart = { path = "crates/fashionstar-uart" }
json-config-store = { path = "crates/json-config-store" }
perception-core = { path = "crates/perception-core" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
r2r = { git = "https://github.com/sequenceplanner/r2r.git", rev = "2d080c4dede3ec950620d2b82f6521bc4fa1e690", default-features = false }
serialport = { version = "4.8.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.22.0"
sha2 = "0.11.0"
spatial-core = { path = "crates/spatial-core" }
stararm-102-model = { path = "devices/stararm-102/crates/model" }
thiserror = "2.0.20"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "net", "signal"] }
urdf-rs = "0.9.0"
walkdir = "2.5.0"
