[project]
name = "perception-compute-service"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "clip @ https://github.com/ultralytics/CLIP/archive/a13192f8cb767260d7dfd98c843b0716593169e7.zip",
  "fastapi==0.141.1",
  "numpy==2.5.2",
  "opencv-python==5.0.0.93",
  "pillow==12.3.0",
  "pydantic==2.13.5",
  "ultralytics==8.4.135",
  "uvicorn==0.52.4",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
  "httpx2==2.12.0",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
