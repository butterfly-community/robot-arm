# yaml-language-server: $schema=https://raw.githubusercontent.com/dora-rs/dora/main/dora-schema.json
debug:
  enable_debug_inspection: true

nodes:
  - id: camera-capture-node
    path: /src/target/release/camera-capture-node
    restart_policy: on-failure
    deploy:
      machine: perception
    inputs:
      tick:
        # Polling is deliberately faster than any reported camera profile; the
        # driver remains the sole source of the actual output frame rate.
        source: dora/timer/millis/1
        queue_size: 1
        queue_policy: drop_oldest
      request: web-gateway-node/camera_request
      snapshot: web-gateway-node/camera_snapshot
      motion_state:
        source: stararm-102-motion-node/motion_state
        queue_size: 1
        queue_policy: drop_oldest
    outputs:
      - camera_state
      - frame
      - request_result
      - service_state

  - id: controller-input-node
    path: /src/target/release/controller-input-node
    restart_policy: on-failure
    deploy:
      machine: controller-input
    inputs:
      tick:
        source: dora/timer/hz/100
        queue_size: 1
        queue_policy: drop_oldest
      snapshot: web-gateway-node/tracking_snapshot
      select_pose_source: web-gateway-node/select_pose_source_request
      apply_bindings: web-gateway-node/apply_bindings_request
      rename_source: web-gateway-node/rename_input_source_request
      set_simulation: web-gateway-node/set_simulation_request
      action_feedback:
        source: stararm-102-execution-node/action_feedback
        queue_size: 1
        queue_policy: drop_oldest
    outputs:
      - discovery_state
      - service_state
      - absolute_pose
      - control_input
      - pose_source_request_result
      - bindings_request_result
      - source_name_request_result
      - simulation_request_result

  - id: perception-node
    path: /src/target/release/perception-node
    restart_policy: on-failure
    deploy:
      machine: perception
    inputs:
      camera_frame:
        source: camera-capture-node/frame
        queue_size: 1
        queue_policy: drop_oldest
      camera_state: camera-capture-node/camera_state
      tick:
        source: dora/timer/hz/10
        queue_size: 1
        queue_policy: drop_oldest
      request: web-gateway-node/perception_request
      calibration_request: web-gateway-node/calibration_request
      asset_request: web-gateway-node/perception_asset_request
      snapshot: web-gateway-node/perception_snapshot
      arm_state:
        source: stararm-102-execution-node/arm_state
        queue_size: 1
        queue_policy: drop_oldest
      motion_state:
        source: stararm-102-motion-node/motion_state
        queue_size: 1
        queue_policy: drop_oldest
      robot_model_info: stararm-102-execution-node/robot_model_info
    outputs:
      - perception_state
      - world_scene
      - request_result
      - calibration_state
      - calibration_request_result
      - calibration_control_mode
      - calibration_motion_request
      - asset_response
      - service_state

  - id: spatial-transform-node
    path: /src/target/release/spatial-transform-node
    deploy:
      machine: spatial-transform
    inputs:
      absolute_pose:
        source: controller-input-node/absolute_pose
        queue_size: 1
        queue_policy: drop_oldest
      control_input:
        source: controller-input-node/control_input
        queue_size: 1
        queue_policy: drop_oldest
      update_config: web-gateway-node/update_spatial_config_request
      snapshot: web-gateway-node/spatial_snapshot
    outputs:
      - spatial_pose
      - transformed_control
      - config_state
      - service_state
      - request_result

  - id: stararm-102-motion-node
    path: /src/target/release/stararm-102-motion-node
    deploy:
      machine: stararm-102-motion
    inputs:
      transformed_control:
        source: spatial-transform-node/transformed_control
        queue_size: 1
        queue_policy: drop_oldest
      arm_state:
        source: stararm-102-execution-node/arm_state
        queue_size: 1
        queue_policy: drop_oldest
      world_scene:
        source: perception-node/world_scene
        queue_size: 1
        queue_policy: drop_oldest
      perception_state:
        source: perception-node/perception_state
        queue_size: 1
        queue_policy: drop_oldest
      robot_model_info: stararm-102-execution-node/robot_model_info
      set_control_mode: web-gateway-node/set_control_mode_request
      calibration_control_mode: perception-node/calibration_control_mode
      prepare_relative: web-gateway-node/prepare_relative_request
      motion_request: web-gateway-node/motion_request
      calibration_motion_request: perception-node/calibration_motion_request
      tool_actuator_request: web-gateway-node/tool_actuator_request
      pick_place_request: web-gateway-node/pick_place_request
      snapshot: web-gateway-node/motion_snapshot
      tick:
        source: dora/timer/millis/10
        queue_size: 1
        queue_policy: drop_oldest
    outputs:
      - motion_state
      - service_state
      - motion_status
      - actuator_status
      - arm_command
      - mode_request_result
      - motion_request_result
      - manipulation_state
      - manipulation_request_result

  - id: stararm-102-execution-node
    path: /src/target/release/stararm-102-execution-node
    deploy:
      machine: stararm-102-execution
    inputs:
      arm_command:
        source: stararm-102-motion-node/arm_command
        queue_size: 1
        queue_policy: drop_oldest
      execution_request: web-gateway-node/execution_request
      model_asset_request: web-gateway-node/model_asset_request
      snapshot: web-gateway-node/execution_snapshot
      tick:
        source: dora/timer/millis/10
        queue_size: 1
        queue_policy: drop_oldest
    outputs:
      - execution_info
      - robot_model_info
      - model_asset_response
      - transport_state
      - arm_state
      - action_feedback
      - service_state
      - request_result

  - id: service-status-node
    path: /src/target/release/service-status-node
    deploy:
      machine: service-status
    inputs:
      camera-capture: camera-capture-node/service_state
      controller-input: controller-input-node/service_state
      perception: perception-node/service_state
      spatial-transform: spatial-transform-node/service_state
      stararm-102-motion: stararm-102-motion-node/service_state
      stararm-102-execution: stararm-102-execution-node/service_state
    outputs:
      - system_readiness

  - id: web-gateway-node
    path: /src/target/release/web-gateway-node
    deploy:
      machine: web-gateway
    inputs:
      discovery_state: controller-input-node/discovery_state
      absolute_pose:
        source: controller-input-node/absolute_pose
        queue_size: 1
        queue_policy: drop_oldest
      control_input:
        source: controller-input-node/control_input
        queue_size: 1
        queue_policy: drop_oldest
      pose_source_request_result: controller-input-node/pose_source_request_result
      bindings_request_result: controller-input-node/bindings_request_result
      source_name_request_result: controller-input-node/source_name_request_result
      simulation_request_result: controller-input-node/simulation_request_result
      perception_state: perception-node/perception_state
      camera_state: camera-capture-node/camera_state
      camera_request_result: camera-capture-node/request_result
      world_scene: perception-node/world_scene
      perception_request_result: perception-node/request_result
      calibration_state: perception-node/calibration_state
      calibration_request_result: perception-node/calibration_request_result
      perception_asset_response: perception-node/asset_response
      spatial_pose:
        source: spatial-transform-node/spatial_pose
        queue_size: 1
        queue_policy: drop_oldest
      spatial_config_state: spatial-transform-node/config_state
      spatial_service_state: spatial-transform-node/service_state
      transformed_control:
        source: spatial-transform-node/transformed_control
        queue_size: 1
        queue_policy: drop_oldest
      spatial_request_result: spatial-transform-node/request_result
      robot_model_info: stararm-102-execution-node/robot_model_info
      motion_state: stararm-102-motion-node/motion_state
      motion_status: stararm-102-motion-node/motion_status
      actuator_status: stararm-102-motion-node/actuator_status
      mode_request_result: stararm-102-motion-node/mode_request_result
      motion_request_result: stararm-102-motion-node/motion_request_result
      manipulation_state: stararm-102-motion-node/manipulation_state
      manipulation_request_result: stararm-102-motion-node/manipulation_request_result
      model_asset_response: stararm-102-execution-node/model_asset_response
      execution_info: stararm-102-execution-node/execution_info
      transport_state:
        source: stararm-102-execution-node/transport_state
        queue_size: 1
        queue_policy: drop_oldest
      execution_service_state: stararm-102-execution-node/service_state
      arm_state:
        source: stararm-102-execution-node/arm_state
        queue_size: 1
        queue_policy: drop_oldest
      execution_request_result: stararm-102-execution-node/request_result
      system_readiness: service-status-node/system_readiness
    outputs:
      - tracking_snapshot
      - select_pose_source_request
      - apply_bindings_request
      - rename_input_source_request
      - set_simulation_request
      - perception_snapshot
      - camera_snapshot
      - camera_request
      - perception_request
      - calibration_request
      - perception_asset_request
      - spatial_snapshot
      - update_spatial_config_request
      - motion_snapshot
      - set_control_mode_request
      - prepare_relative_request
      - motion_request
      - tool_actuator_request
      - pick_place_request
      - model_asset_request
      - execution_snapshot
      - execution_request
