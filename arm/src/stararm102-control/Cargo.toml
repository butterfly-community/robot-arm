[package]
name = "stararm102-control"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Transport-free Star Arm 102-FL profile and MoveIt Servo IPC state"

[dependencies]
nalgebra = { version = "0.35", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
