events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8765;
    location = / { return 302 /tracking/; }
    location /tracking/ { proxy_pass http://web-tracking:3000; proxy_set_header Host $host; }
    location /spatial/ { proxy_pass http://web-spatial:3000; proxy_set_header Host $host; }
    location /motion/ { proxy_pass http://web-motion:3000; proxy_set_header Host $host; }
    location /arm-execution/ { proxy_pass http://web-arm-execution:3000; proxy_set_header Host $host; }
    location /api/ { proxy_pass http://web-gateway:8080; proxy_set_header Host $host; }
    location /ws/ {
      proxy_pass http://web-gateway:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
