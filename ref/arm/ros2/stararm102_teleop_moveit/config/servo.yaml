moveit_servo:
  move_group_name: arm

  command_in_type: speed_units

  command_out_topic: /arm_controller/joint_trajectory
  # The manufacturer's JointTrajectoryController rejects a one-point stream
  # whose final point carries a non-zero velocity. Let it interpolate position
  # commands and keep velocity as feedback-only state.
  publish_joint_velocities: false

  # The folded FL start pose has 2.464 mm clearance between link1 and link4.
  # Override MoveIt's 10 mm default to avoid a false slowdown at the start pose.
  self_collision_proximity_threshold: 0.002
  # MoveIt Servo 2.12.4 zeros every Cartesian command above a finite hard-stop
  # threshold, including commands that would leave the singularity. Keep its
  # status reporting but remove that unrecoverable finite hard stop.
  hard_stop_singularity_threshold: .inf
