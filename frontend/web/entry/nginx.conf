events {}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream tracking { zone tracking 64k; server web-tracking:3000 resolve; }
  upstream spatial { zone spatial 64k; server web-spatial:3000 resolve; }
  upstream perception { zone perception 64k; server web-perception:3000 resolve; }
  upstream motion { zone motion 64k; server web-motion:3000 resolve; }
  upstream arm_execution { zone arm_execution 64k; server web-arm-execution:3000 resolve; }
  upstream gateway { zone gateway 64k; server web-gateway:8080 resolve; }
  upstream camera_video { zone camera_video 64k; server camera:8081 resolve; }
  server {
    listen 8765;
    location = / { return 302 /tracking/; }
    location /tracking/ { proxy_pass http://tracking; proxy_set_header Host $host; }
    location /spatial/ { proxy_pass http://spatial; proxy_set_header Host $host; }
    location = /perception/api/instruction/ {
      proxy_pass http://perception;
      proxy_set_header Host $host;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
    location /perception/ { proxy_pass http://perception; proxy_set_header Host $host; }
    location /motion/ { proxy_pass http://motion; proxy_set_header Host $host; }
    location /arm-execution/ { proxy_pass http://arm_execution; proxy_set_header Host $host; }
    # Visual prompt requests include the original reference image. Do not
    # impose nginx's default 1 MiB text-body limit on this image endpoint.
    location = /api/perception/request {
      client_max_body_size 0;
      proxy_pass http://gateway;
      proxy_set_header Host $host;
    }
    location /api/ { proxy_pass http://gateway; proxy_set_header Host $host; }
    location = /ws/camera-video {
      proxy_pass http://camera_video/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location /ws/ {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
